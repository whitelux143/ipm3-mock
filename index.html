<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>知的財産管理技能検定3級 模擬テスト</title>
<style>:root{--bg:#f5f3ee;--card:#fff;--ink:#1d2433;--mute:#667085;--line:#e3dfd6;--pri:#1f4e79;--pri2:#e8f0f8;--ok:#1e7a46;--okb:#e5f4ea;--ng:#b42318;--ngb:#fdecea;--warn:#a15c07;--warnb:#fff4e0;--gold:#c48a00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;font-size:16px;line-height:1.75}
.app{max-width:640px;margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
p{margin:.4em 0}
h1{font-size:1.5rem;margin:.1em 0;line-height:1.35}
h2{font-size:1.1rem;margin:0}
h3{font-size:1.05rem;margin:.3em 0 .5em}
.muted{color:var(--mute)}.small{font-size:.85rem}.center{text-align:center}
.pad{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.hero{padding:28px 18px 12px}
.kicker{display:inline-block;font-size:.8rem;font-weight:700;color:var(--pri);background:var(--pri2);padding:2px 10px;border-radius:99px}
.save{margin:0 16px 8px;font-size:.8rem;padding:6px 10px;border-radius:8px}
.save.on{background:var(--okb);color:var(--ok)}.save.off{background:var(--warnb);color:var(--warn)}
.mode{background:var(--card);margin:12px 12px;border-radius:16px;padding:16px;border:1px solid var(--line)}
.mh{display:flex;align-items:center;gap:8px}
.num{font-size:1.2rem;color:var(--pri);font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.big-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--pri);color:#fff;border:0;border-radius:14px;padding:14px;min-height:76px}
.big-btn b{font-size:1.15rem}.big-btn span{font-size:.82rem;opacity:.9}
.big-btn.wide{width:100%;margin-top:10px}
.big-btn:disabled{background:#c9ccd3}
.resets{margin-top:8px;display:flex;flex-direction:column;align-items:flex-start}
.seg{display:flex;background:#eeeae1;border-radius:12px;padding:4px;margin:10px 0}
.seg button{flex:1;border:0;background:transparent;padding:10px;border-radius:9px;font-weight:700;color:var(--mute)}
.seg button.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.ranges{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rbtn{display:flex;flex-direction:column;align-items:flex-start;padding:12px 14px;min-height:62px;border:1px solid var(--line);border-radius:12px;background:#fbfaf7;text-align:left}
.rbtn b{color:var(--pri)}
.hist{list-style:none;padding:0;margin:8px 0 0}.hist li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.kk{padding-left:1.1em;font-size:.88rem}.kk li{margin:.5em 0}
details summary{cursor:pointer;color:var(--pri);font-weight:700;padding:6px 0}
.foot{padding:8px 18px 24px}
.top{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;background:rgba(245,243,238,.96);backdrop-filter:blur(6px);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line)}
.ttl{font-weight:700;font-size:.95rem;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back,.lnk{background:none;border:0;color:var(--pri);font-weight:700;padding:8px 6px;min-height:40px}
.sub{padding:10px 16px 4px}
.pos{font-size:1.05rem}
.prog{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--mute)}
.bar{flex:1;height:8px;background:#e4e0d6;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .2s}
.card{background:var(--card);margin:10px 12px;border-radius:16px;padding:16px;border:1px solid var(--line)}
.qhead{display:flex;align-items:center;gap:8px;margin:14px 0 4px}
.card>.qhead:first-child{margin-top:0}
.qno{font-weight:800;font-size:1.15rem;color:var(--pri)}
.tag{font-size:.75rem;background:var(--pri2);color:var(--pri);padding:2px 8px;border-radius:99px;font-weight:700}
.flag{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 10px;font-size:.78rem;min-height:34px;color:var(--mute)}
.flag.on{border-color:var(--gold);color:var(--gold);background:#fff9e6}
.stem{margin:6px 0 10px}
.stem .passage,.passagebox{background:#faf8f3;border-left:4px solid #d7cfbd;padding:10px 12px;border-radius:6px}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:2.4em;height:1.5em;border:1.5px solid var(--ink);border-radius:3px;font-size:.8em;font-weight:700;margin:0 3px;vertical-align:.05em;background:#fff}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;min-height:56px}
.choice .ck{flex:none;width:32px;height:32px;border-radius:50%;background:#f0ede6;display:flex;align-items:center;justify-content:center;font-weight:800}
.choice .ct{flex:1;padding-top:2px}
.choice.sel{border-color:var(--pri);background:var(--pri2)}.choice.sel .ck{background:var(--pri);color:#fff}
.choice.ans{border-color:var(--ok);background:var(--okb)}.choice.ans .ck{background:var(--ok);color:#fff}
.choice.ng{border-color:var(--ng);background:var(--ngb)}.choice.ng .ck{background:var(--ng);color:#fff}
.choice:disabled{color:inherit;opacity:1}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.oxb{display:flex;flex-direction:column;align-items:center;font-size:2rem;font-weight:800;line-height:1.2;padding:12px;border:2px solid var(--line);border-radius:14px;background:#fff;min-height:84px}
.oxb small{font-size:.8rem;font-weight:600;color:var(--mute)}
.oxb.sel{border-color:var(--pri);background:var(--pri2);color:var(--pri)}
.oxb.ans{border-color:var(--ok);background:var(--okb);color:var(--ok)}.oxb.ng{border-color:var(--ng);background:var(--ngb);color:var(--ng)}
.oxb:disabled{opacity:1}
.shared{border:1px solid #d7cfbd;border-radius:12px;margin-bottom:10px;overflow:hidden}
.shared-h{width:100%;display:flex;justify-content:space-between;background:#f3efe6;border:0;padding:10px 12px;font-weight:700;min-height:44px}
.chev{font-size:.78rem;color:var(--mute);font-weight:600}
.shared-b{padding:6px 12px 10px;font-size:.93rem}
.stmt{padding:6px 8px;border-radius:8px}.stmt.hl{background:#fff4cf}
.stmt-now{font-size:.9rem;background:#fff9e6;border-radius:8px;padding:8px 10px}
.table{border:1.5px solid #bdb5a3;border-radius:8px;padding:10px 12px;margin:10px 0;font-size:.9rem;background:#fcfbf8}
.tcap{margin-bottom:6px}
.trow{display:grid;grid-template-columns:9.5em 1fr;gap:8px;padding:4px 0;border-top:1px dashed #e0dbcf}
@media (max-width:360px){.trow{grid-template-columns:1fr}}
.inlab{display:block;font-weight:700;margin-top:12px}
.yen{display:flex;align-items:center;gap:8px}
.yen input{flex:1;font-size:1.4rem;padding:12px 14px;border:2px solid var(--line);border-radius:12px;min-width:0;background:#fff}
.yen input:focus{outline:none;border-color:var(--pri)}
.yen span{font-size:1.2rem;font-weight:700}
.gogun{background:#f3efe6;border-radius:10px;padding:10px 12px;margin:10px 0}
.chip{display:inline-block;background:#fff;border:1px solid #d7cfbd;border-radius:99px;padding:2px 10px;margin:4px 6px 0 0;font-size:.88rem}
.blankq{border-top:1px solid var(--line);margin-top:10px}
.wordgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wbtn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 8px;min-height:50px;font-size:.92rem;font-weight:600}
.wbtn.sel{border-color:var(--pri);background:var(--pri2);color:var(--pri)}
.wbtn.ans{border-color:var(--ok);background:var(--okb);color:var(--ok)}.wbtn.ng{border-color:var(--ng);background:var(--ngb);color:var(--ng)}
.wbtn:disabled{opacity:1}
.exp{margin-top:16px;border-top:2px solid var(--line);padding-top:12px}
.step{display:flex;gap:10px;margin:12px 0}
.step>div{flex:1;min-width:0}
.sn{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:.8rem;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px}
.sl{font-weight:800;font-size:.9rem;color:var(--mute)}
.sv{font-size:1rem}.big{font-size:1.3rem;font-weight:800}
.mk{display:inline-block;font-size:.75rem;font-weight:800;padding:1px 8px;border-radius:99px;margin-left:6px;vertical-align:.1em}
.mk.ok{background:var(--okb);color:var(--ok)}.mk.ng{background:var(--ngb);color:var(--ng)}.mk.na{background:#eee;color:var(--mute)}
.pol{font-size:.88rem;background:#f4f6fa;border-radius:8px;padding:8px 10px;margin-top:4px}
.optlist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.opt{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.92rem}
.opt.pick{border-color:var(--ok);background:#f6fbf7}
.oh{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ok2{font-weight:800}
.vd{font-size:.75rem;font-weight:800;padding:1px 8px;border-radius:99px}.vg{background:var(--okb);color:var(--ok)}.vb{background:var(--ngb);color:var(--ng)}
.pk{font-size:.78rem;font-weight:800;color:var(--ok)}
.point{background:#fff9e6;border-radius:8px;padding:8px 10px;font-weight:600}
.keybox{background:#eef4fb;border-radius:8px;padding:8px 10px;margin-top:6px}
.calc{background:#f4f6fa;border-radius:10px;padding:8px 12px;margin:8px 0;display:flex;flex-direction:column;gap:6px;font-size:.93rem}
.cl{display:inline-block;font-size:.75rem;font-weight:800;background:var(--ink);color:#fff;border-radius:6px;padding:0 8px;margin-right:8px}
.src{margin-top:14px;font-size:.85rem;background:#faf8f3;border-radius:10px;padding:10px 12px}
.sh{font-weight:800}
.note{margin-top:6px}
.kakunin{margin-top:6px;background:var(--warnb);color:#6b3d00;border-radius:8px;padding:8px 10px}
.pdftext{white-space:pre-wrap;font-size:.85rem;color:#3a4150}
.spacer{height:20px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid var(--line);max-width:640px;margin:0 auto}
.nb{min-height:52px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:1rem}
.nb.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.nb:disabled{opacity:.35}
.btn{min-height:52px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:1rem;width:100%;margin-top:8px}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn:disabled{background:#c9ccd3;border-color:#c9ccd3;color:#fff}
.ov{position:fixed;inset:0;background:rgba(20,24,33,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.grid{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.gq{min-width:46px;min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.gq.done{background:var(--pri2);border-color:#9db8d6;color:var(--pri)}
.gq.cur{outline:3px solid var(--pri)}
.gq.warn{background:var(--warnb);border-color:#f0c27a;color:var(--warn)}
.gq.wide{padding:0 10px;font-size:.9rem}
.scorebox{margin:12px;background:var(--pri);color:#fff;border-radius:18px;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.sc b{font-size:2.6rem;line-height:1}.sc span{margin-left:4px}
.scr{font-size:.92rem;text-align:right}
.ritem{margin:8px 12px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rh{width:100%;display:flex;align-items:center;gap:8px;background:none;border:0;padding:12px;text-align:left;min-height:52px}
.rl{font-weight:800;color:var(--pri);flex:none}
.rms{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.rm{font-size:.76rem;font-weight:700;padding:1px 7px;border-radius:99px}
.rm.ok{background:var(--okb);color:var(--ok)}.rm.ng{background:var(--ngb);color:var(--ng)}.rm.na{background:#eee;color:var(--mute)}
.ritem .card{margin:0;border:0;border-top:1px solid var(--line);border-radius:0}
.empty{padding:40px 20px;text-align:center;color:var(--mute)}
</style></head>
